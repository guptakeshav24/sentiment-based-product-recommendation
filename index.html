<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Based Product Recommendation System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 1.1em;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1.1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        input[type="text"].error {
            border-color: #e74c3c;
        }

        .error-message {
            color: #e74c3c;
            font-size: 0.9em;
            margin-top: 5px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            font-size: 1.1em;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-container {
            margin-top: 30px;
            display: none;
        }

        .result-container.show {
            display: block;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .result-title {
            font-size: 1.5em;
            color: #333;
            font-weight: 600;
        }

        .result-count {
            color: #667eea;
            font-weight: 600;
        }

        .json-display {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            max-height: 600px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.95em;
            line-height: 1.6;
        }

        .error-display {
            background: #fee;
            border: 2px solid #e74c3c;
            border-radius: 10px;
            padding: 20px;
            color: #c0392b;
            margin-top: 20px;
        }

        .recommendation-item {
            background: white;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .recommendation-item strong {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sentiment Based Product Recommendation System</h1>
        
        <form id="recommendationForm">
            <div class="form-group">
                <label for="userId">Enter User ID:</label>
                <input 
                    type="text" 
                    id="userId" 
                    name="userId" 
                    placeholder="e.g., user123"
                    required
                >
                <div class="error-message" id="errorMessage">
                    Please enter a user ID before submitting.
                </div>
            </div>
            
            <button type="submit" id="submitBtn">Get Recommendations</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Fetching recommendations...</p>
        </div>

        <div class="result-container" id="resultContainer">
            <div class="result-header">
                <div class="result-title">Recommendations</div>
                <div class="result-count" id="resultCount"></div>
            </div>
            <div id="resultDisplay"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('recommendationForm');
        const userIdInput = document.getElementById('userId');
        const errorMessage = document.getElementById('errorMessage');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const resultContainer = document.getElementById('resultContainer');
        const resultDisplay = document.getElementById('resultDisplay');
        const resultCount = document.getElementById('resultCount');

        // API endpoint - update port if needed
        const API_URL = 'http://localhost:50000/recommendations';

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const userId = userIdInput.value.trim();
            
            // Validation
            if (!userId) {
                userIdInput.classList.add('error');
                errorMessage.classList.add('show');
                return;
            }

            // Clear previous errors
            userIdInput.classList.remove('error');
            errorMessage.classList.remove('show');
            resultContainer.classList.remove('show');

            // Show loading
            loading.classList.add('show');
            submitBtn.disabled = true;

            try {
                // Call API
                const response = await fetch(`${API_URL}/${userId}`);
                const data = await response.json();

                // Hide loading
                loading.classList.remove('show');
                submitBtn.disabled = false;

                if (!response.ok) {
                    // Handle error response
                    throw new Error(data.error || 'Failed to fetch recommendations');
                }

                // Display results
                displayResults(data);

            } catch (error) {
                // Hide loading
                loading.classList.remove('show');
                submitBtn.disabled = false;

                // Display error
                resultContainer.classList.add('show');
                resultDisplay.innerHTML = `
                    <div class="error-display">
                        <strong>Error:</strong> ${error.message}
                    </div>
                `;
                resultCount.textContent = '';
            }
        });

        function displayResults(data) {
            resultContainer.classList.add('show');
            resultCount.textContent = `${data.total_recommendations || 0} recommendations`;

            // Format and display JSON beautifully
            const formattedJson = JSON.stringify(data, null, 2);
            
            // Create a more readable display
            let html = '<div class="json-display">';
            
            if (data.recommendations && data.recommendations.length > 0) {
                html += '<h3 style="margin-bottom: 15px; color: #333;">Recommended Products:</h3>';
                data.recommendations.forEach((rec, index) => {
                    html += `
                        <div class="recommendation-item">
                            <strong>Rank #${rec.rank || index + 1}:</strong> ${rec.product_name || 'N/A'}
                            ${rec.predicted_rating ? `<br><small>Rating: ${rec.predicted_rating.toFixed(2)}</small>` : ''}
                            ${rec.hybrid_score ? `<br><small>Hybrid Score: ${rec.hybrid_score.toFixed(3)}</small>` : ''}
                        </div>
                    `;
                });
                html += '<hr style="margin: 20px 0;"><h3 style="margin-bottom: 10px; color: #333;">Raw JSON Response:</h3>';
            }
            
            html += `<pre style="background: #2d2d2d; color: #f8f8f2; padding: 15px; border-radius: 5px; overflow-x: auto;">${escapeHtml(formattedJson)}</pre>`;
            html += '</div>';

            resultDisplay.innerHTML = html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Real-time validation
        userIdInput.addEventListener('input', () => {
            if (userIdInput.value.trim()) {
                userIdInput.classList.remove('error');
                errorMessage.classList.remove('show');
            }
        });
    </script>
</body>
</html>
